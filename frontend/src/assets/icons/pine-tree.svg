<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Tree trunk -->
  <rect x="45" y="60" width="10" height="25" fill="#8b4513" rx="2"/>
  
  <!-- Tree layers -->
  <path d="M50 20 L35 40 L65 40 Z" fill="#2d5016" opacity="0.9"/>
  <path d="M50 30 L30 50 L70 50 Z" fill="#4a7c59" opacity="0.8"/>
  <path d="M50 40 L25 60 L75 60 Z" fill="#8fbc8f" opacity="0.7"/>
  
  <!-- Leaves details -->
  <circle cx="40" cy="35" r="3" fill="#a8d5a8" opacity="0.6"/>
  <circle cx="60" cy="45" r="3" fill="#a8d5a8" opacity="0.6"/>
  <circle cx="50" cy="55" r="3" fill="#a8d5a8" opacity="0.6"/>
  
  <!-- Ground -->
  <ellipse cx="50" cy="85" rx="20" ry="3" fill="#4a7c59" opacity="0.3"/>
</svg>
